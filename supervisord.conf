[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
environment=MALLOC_ARENA_MAX="2"

[program:gunicorn]
command=gunicorn -w 1 --threads 4 --keep-alive 5 --timeout 120 -b 0.0.0.0:%(ENV_PORT)s --access-logfile - --error-logfile - app:app
directory=/app
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:celery]
command=bash -c "sleep 15 && PYTHONPATH=/app celery -A celery_app.celery worker --concurrency=1 --pool=solo --loglevel=info"
directory=/app
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
