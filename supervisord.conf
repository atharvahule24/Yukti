[supervisord]
nodaemon=true
user=root

[program:gunicorn]
command=gunicorn -w 4 -b 0.0.0.0:%(ENV_PORT)s app:app
directory=/app
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:celery]
command=celery -A celery_app.celery worker --loglevel=info
directory=/app
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
